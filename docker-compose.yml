services:
  app:
    build: .
    # .env is gitignored — Compose auto-loads it (if present) to resolve the ${VAR} references
    # below (see .env.example for the full list this app needs), and env_file passes through
    # anything else it defines (e.g. Sentry vars) that isn't already listed in `environment:`.
    # Environment-specific values (FHIR server URL, auth provider endpoints/keys) are only ever
    # set in .env, never hardcoded here, so no internal hostnames or credentials get committed.
    env_file:
      - path: .env
        required: false
    environment:
      REACT_APP_VERSION: 'local'
      # Set REACT_APP_FHIR_SERVER_URL in .env — no default here so no internal hostname
      # ends up committed to this tracked file.
      REACT_APP_FHIR_SERVER_URL: ${REACT_APP_FHIR_SERVER_URL}
      REACT_APP_AWS_REGION: 'us-east-1'
      # list of AuthProviders
      REACT_APP_AUTH_PROVIDERS: 'cognito,bwellapp,clientcredentials'
      # Each AuthProvider has its own set of environment variables
      REACT_APP_AUTH_COGNITO_CUSTOM_USERNAME: 'cognito:username'
      REACT_APP_AUTH_COGNITO_CUSTOM_GROUP: 'cognito:groups'
      REACT_APP_AUTH_COGNITO_CUSTOM_SCOPE: 'custom:scope'
      REACT_APP_AUTH_COGNITO_CLIENT_ID: 'fhir-ui'
      REACT_APP_AUTH_COGNITO_LOGIN_SCOPES: ''
      REACT_APP_AUTH_COGNITO_REDIRECT_URL: 'http://localhost:5051/authcallback'
      REACT_APP_AUTH_COGNITO_WELL_KNOWN_URL: 'http://localhost:8080/realms/master/.well-known/openid-configuration'
      REACT_APP_AUTH_COGNITO_TOKEN_TO_SEND_TO_FHIR_SERVER: 'jwt' # other option is 'id_token'
      REACT_APP_AUTH_COGNITO_TOKEN_FOR_USER_DETAILS: 'jwt'
      # To configure Okta, uncomment the following lines and set the appropriate values
      # and add 'okta' to REACT_APP_AUTH_PROVIDERS
      # 
      # REACT_APP_AUTH_OKTA_CUSTOM_USERNAME: 'preferred_username'
      # REACT_APP_AUTH_OKTA_CUSTOM_GROUP: 'groups'
      # REACT_APP_AUTH_OKTA_CUSTOM_SCOPE: 'custom:scope'
      # REACT_APP_AUTH_OKTA_CLIENT_ID: ''
      # REACT_APP_AUTH_OKTA_REDIRECT_URL: 'http://localhost:5051/authcallback'
      # REACT_APP_AUTH_OKTA_WELL_KNOWN_URL: ''
      # REACT_APP_AUTH_OKTA_TOKEN_TO_SEND_TO_FHIR_SERVER: 'jwt'
      # REACT_APP_AUTH_OKTA_TOKEN_FOR_USER_DETAILS: 'id_token'
      # REACT_APP_AUTH_OKTA_REMOVE_SCOPE_PREFIX: ''
      # b.well App sign-in (bwellapp is enabled in REACT_APP_AUTH_PROVIDERS above) -
      # set REACT_APP_AUTH_BWELLAPP_BASE_URL and REACT_APP_AUTH_BWELLAPP_CLIENT_KEYS in .env
      REACT_APP_AUTH_BWELLAPP_BASE_URL: ${REACT_APP_AUTH_BWELLAPP_BASE_URL}
      REACT_APP_AUTH_BWELLAPP_CLIENT_KEYS: ${REACT_APP_AUTH_BWELLAPP_CLIENT_KEYS}
      REACT_APP_AUTH_BWELLAPP_CUSTOM_USERNAME: 'cognito:username'
      REACT_APP_AUTH_BWELLAPP_CUSTOM_GROUP: 'cognito:groups'
      REACT_APP_AUTH_BWELLAPP_CUSTOM_SCOPE: 'custom:scope'
      REACT_APP_AUTH_BWELLAPP_CLIENT_ID: 'bwellapp'
      REACT_APP_AUTH_BWELLAPP_TOKEN_FOR_USER_DETAILS: 'jwt'
      REACT_APP_AUTH_BWELLAPP_TOKEN_TO_SEND_TO_FHIR_SERVER: 'jwt'
      # Client-credentials sign-in (clientcredentials is enabled in REACT_APP_AUTH_PROVIDERS
      # above) - the login page lets you pick Cognito or Descope; set
      # REACT_APP_AUTH_COGNITOCC_TOKEN_URL in .env for whichever provider(s) you want to use
      REACT_APP_AUTH_COGNITOCC_TOKEN_URL: ${REACT_APP_AUTH_COGNITOCC_TOKEN_URL}
      REACT_APP_AUTH_COGNITOCC_CUSTOM_USERNAME: 'client_id'
      REACT_APP_AUTH_COGNITOCC_CUSTOM_GROUP: 'scope'
      REACT_APP_AUTH_COGNITOCC_CUSTOM_SCOPE: 'scope'
      REACT_APP_AUTH_COGNITOCC_CLIENT_ID: 'cognitocc'
      REACT_APP_AUTH_COGNITOCC_TOKEN_FOR_USER_DETAILS: 'jwt'
      REACT_APP_AUTH_COGNITOCC_TOKEN_TO_SEND_TO_FHIR_SERVER: 'jwt'
      REACT_APP_AUTH_DESCOPECC_TOKEN_URL: 'https://api.descope.com/oauth2/v1/apps/token'
      REACT_APP_AUTH_DESCOPECC_CUSTOM_USERNAME: 'client_id'
      REACT_APP_AUTH_DESCOPECC_CUSTOM_GROUP: 'scope'
      REACT_APP_AUTH_DESCOPECC_CUSTOM_SCOPE: 'scope'
      REACT_APP_AUTH_DESCOPECC_CLIENT_ID: 'descopecc'
      REACT_APP_AUTH_DESCOPECC_TOKEN_FOR_USER_DETAILS: 'jwt'
      REACT_APP_AUTH_DESCOPECC_TOKEN_TO_SEND_TO_FHIR_SERVER: 'jwt'
    ports:
      - '5051:5051'
    volumes:
      - ./src:/app/src/
      - ./public:/app/public/
      - ./index.html:/app/index.html
    command: yarn dev --host
